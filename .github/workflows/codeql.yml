name: "CodeQL Advanced"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    permissions:
      contents: read
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-codeql.yml@19c40e008be9ffa0344d0d712f60b504bbe1f02f # v1.3.5
    with:
      language: "java-kotlin"
      build-mode: "manual"
      build-command: "./gradlew assembleDebug --no-build-cache --no-daemon"
