name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  android-ci:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: Noahffiliation/.github/.github/workflows/reusable-android-ci.yml@a1418f2ef8021761fd9421989868e5388abdf927
    with:
      java-version: "21"
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
